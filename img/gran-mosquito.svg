<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="El Gran Mosquito — ilustración del sitio web de la parrilla">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1119"/>
      <stop offset="1" stop-color="#0c1521"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(0,255,170,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- ventana -->
  <rect x="36" y="30" width="568" height="300" rx="10" fill="#0a1119" stroke="rgba(0,255,170,0.18)"/>
  <rect x="36" y="30" width="568" height="32" rx="10" fill="rgba(0,0,0,0.35)"/>
  <circle cx="56" cy="46" r="5" fill="#ff5f57"/>
  <circle cx="74" cy="46" r="5" fill="#febc2e"/>
  <circle cx="92" cy="46" r="5" fill="#28c840"/>
  <text x="114" y="50" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#7d93a3">el-gran-mosquito — sitio web</text>
  <rect x="488" y="38" width="100" height="17" rx="8.5" fill="rgba(255,180,84,0.12)" stroke="#ffb454"/>
  <text x="538" y="50" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#ffb454" text-anchor="middle">EN DESARROLLO</text>

  <!-- parrilla (icono) -->
  <g fill="none" stroke="#ffb454" stroke-width="3" stroke-linecap="round">
    <path d="M86 150h92"/>
    <path d="M94 150a38 38 0 0 0 76 0"/>
    <path d="M108 190l-10 28M156 190l10 28"/>
    <path d="M112 132c-6-8 6-12 0-20M132 132c-6-8 6-12 0-20M152 132c-6-8 6-12 0-20" stroke="#ff5f57" stroke-width="2.5"/>
  </g>

  <!-- titulo -->
  <text x="214" y="128" font-family="Poppins, Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#d6e7e1">El Gran Mosquito</text>
  <text x="214" y="152" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d93a3">Parrilla · Almagro, CABA</text>

  <!-- secciones -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="11.5">
    <rect x="214" y="172" width="64" height="24" rx="6" fill="rgba(0,255,163,0.07)" stroke="rgba(0,255,170,0.25)"/>
    <text x="246" y="188" fill="#00ffa3" text-anchor="middle">Carta</text>
    <rect x="286" y="172" width="84" height="24" rx="6" fill="rgba(0,255,163,0.07)" stroke="rgba(0,255,170,0.25)"/>
    <text x="328" y="188" fill="#00ffa3" text-anchor="middle">Horarios</text>
    <rect x="378" y="172" width="84" height="24" rx="6" fill="rgba(0,255,163,0.07)" stroke="rgba(0,255,170,0.25)"/>
    <text x="420" y="188" fill="#00ffa3" text-anchor="middle">Reseñas</text>
    <rect x="470" y="172" width="110" height="24" rx="6" fill="rgba(53,214,255,0.07)" stroke="rgba(53,214,255,0.3)"/>
    <text x="525" y="188" fill="#35d6ff" text-anchor="middle">Abierto ahora</text>
  </g>

  <!-- reserva -->
  <text x="58" y="268" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#00ffa3">$ <tspan fill="#35d6ff">reservar</tspan> --mesa 4 --hora 21:00</text>
  <text x="58" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#7d93a3">➜ el formulario arma el mensaje y abre WhatsApp</text>
</svg>
