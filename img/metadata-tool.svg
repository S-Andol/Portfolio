<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Metadata Tool — ilustración del análisis de metadatos de un archivo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1119"/>
      <stop offset="1" stop-color="#0c1521"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(0,255,170,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- ventana -->
  <rect x="36" y="30" width="568" height="300" rx="10" fill="#0a1119" stroke="rgba(0,255,170,0.18)"/>
  <rect x="36" y="30" width="568" height="32" rx="10" fill="rgba(0,0,0,0.35)"/>
  <circle cx="56" cy="46" r="5" fill="#ff5f57"/>
  <circle cx="74" cy="46" r="5" fill="#febc2e"/>
  <circle cx="92" cy="46" r="5" fill="#28c840"/>
  <text x="114" y="50" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#7d93a3">Metadata Tool — v1.0.0</text>

  <!-- archivo -->
  <rect x="58" y="80" width="132" height="132" rx="8" fill="rgba(53,214,255,0.06)" stroke="rgba(53,214,255,0.35)"/>
  <path d="M74 190l30-38 22 26 16-18 32 30z" fill="rgba(53,214,255,0.25)"/>
  <circle cx="160" cy="108" r="11" fill="rgba(53,214,255,0.35)"/>
  <text x="124" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#7d93a3" text-anchor="middle">foto.heic</text>

  <!-- filas de metadatos -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="214" y="96" fill="#35d6ff">camera</text>
    <text x="300" y="96" fill="#d6e7e1">modelo · lente · fecha de captura</text>
    <line x1="214" y1="108" x2="580" y2="108" stroke="rgba(255,255,255,0.06)"/>

    <text x="214" y="130" fill="#35d6ff">gps</text>
    <text x="300" y="130" fill="#d6e7e1">coordenadas detectadas</text>
    <rect x="496" y="117" width="84" height="18" rx="9" fill="rgba(255,180,84,0.12)" stroke="#ffb454"/>
    <text x="538" y="130" font-size="10" fill="#ffb454" text-anchor="middle">EXPOSICIÓN</text>
    <line x1="214" y1="142" x2="580" y2="142" stroke="rgba(255,255,255,0.06)"/>

    <text x="214" y="164" fill="#35d6ff">sha-256</text>
    <text x="300" y="164" fill="#d6e7e1">integridad · duplicados exactos</text>
    <line x1="214" y1="176" x2="580" y2="176" stroke="rgba(255,255,255,0.06)"/>

    <text x="214" y="198" fill="#35d6ff">phash</text>
    <text x="300" y="198" fill="#d6e7e1">similitud visual entre imágenes</text>
    <line x1="214" y1="210" x2="580" y2="210" stroke="rgba(255,255,255,0.06)"/>
  </g>

  <!-- accion -->
  <text x="58" y="268" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#00ffa3">$ <tspan fill="#35d6ff">sanitize</tspan> --copy</text>
  <text x="58" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#7d93a3">➜ copia sin metadatos creada · el original no se modifica</text>
  <rect x="496" y="254" width="84" height="20" rx="10" fill="rgba(0,255,163,0.12)" stroke="#00ffa3"/>
  <text x="538" y="268" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#00ffa3" text-anchor="middle">SIN GPS</text>
</svg>
